name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Puppeteer's managed Chrome for Testing cannot bring up its own sandbox on the
  # hosted runner images: Ubuntu 24.04 restricts unprivileged user namespaces, and
  # container/root runners refuse the setuid sandbox outright. Without this the
  # SVG/PNG renderer never launches and the e2e, renderer and package suites fail
  # before they run. The renderer only ever loads a local, network-isolated
  # document, so dropping the sandbox does not widen what the page can reach.
  MCP_BPMN_BROWSER_ARGS: "--no-sandbox --disable-setuid-sandbox"

jobs:
  installer-package:
    name: Installer and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.12
        uses: actions/setup-node@v6
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test package with the platform shell
        run: npm run test:package

      - name: Test installer with platform-native make and sh
        run: npm run test:installer

  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.12', '24']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run contributor quality gate
        run: npm run check
